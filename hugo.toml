# ============================================================
# Hugo 站点配置
# ============================================================
# 重要：baseURL 需改成你自己的 GitHub Pages 地址。
#   用户主页仓库： https://<用户名>.github.io/
#   项目仓库：     https://<用户名>.github.io/<仓库名>/
# 部署时 GitHub Actions 会用 configure-pages 自动覆盖 baseURL，
# 这里主要影响本地预览（hugo server 会按此路径提供服务）。
baseURL = "https://USERNAME.github.io/hogo/"
theme = "minimal"
hasCJKLanguage = true              # 中文正文，用于估算阅读时间与摘要
enableRobotsTXT = true
buildFuture = true                # 发布未来日期的文章，避免 UTC 时区差导致文章被跳过

# ---- 多语言 ----
defaultContentLanguage = "zh"         # 默认语言：中文
defaultContentLanguageInSubdir = false  # 默认语言不加 /zh/ 前缀，英文加 /en/ 前缀

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

# ---- 中文站点 ----
[languages.zh]
  label = "中文"
  locale = "zh-cn"
  contentDir = "content/zh"
  weight = 1
  title = "我思故我在"
  [languages.zh.params]
    author = "知白"
    description = "关于学术、思想与文字的札记。"
  [[languages.zh.menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[languages.zh.menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[languages.zh.menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 3
  [[languages.zh.menu.main]]
    name = "关于"
    url = "/about/"
    weight = 4

# ---- 英文站点 ----
[languages.en]
  label = "English"
  locale = "en"
  contentDir = "content/en"
  weight = 2
  title = "Cogito Ergo Sum"
  [languages.en.params]
    author = "Zhibai"
    description = "Notes on academia, ideas, and writing."
  [[languages.en.menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[languages.en.menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2
  [[languages.en.menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3
  [[languages.en.menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true               # 允许 Markdown 中混用原生 HTML

    # 保留数学公式原样，供 KaTeX 渲染（需 Hugo 0.128+）
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["$$", "$$"], ["\\[", "\\]"]]
          inline = [["\\(", "\\)"]]
