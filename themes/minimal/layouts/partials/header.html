<header class="site-header">
  <div class="container">
    <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <nav class="site-nav">
      {{ $current := .RelPermalink }}
      {{ range .Site.Menus.main }}
        {{ $url := .URL | relURL }}
        <a href="{{ $url }}" class="{{ if eq $current $url }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
