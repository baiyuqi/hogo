{{ define "main" }}
<div class="container">
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="tag-cloud">
    {{ range .Data.Terms.Alphabetical }}
      <a class="tag" href="{{ .Page.RelPermalink }}">#{{ .Page.Title }} <span class="tag-count">{{ .Count }}</span></a>
    {{ end }}
  </div>
</div>
{{ end }}
