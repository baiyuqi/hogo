{{ define "main" }}
<div class="container">
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
        <span> · {{ i18n "readingTime" .ReadingTime }}</span>
      </div>
    </header>

    {{ if .Params.toc }}
      <details class="toc">
        <summary>{{ i18n "toc" }}</summary>
        {{ .TableOfContents }}
      </details>
    {{ end }}

    <div class="post-content">
      {{ .Content }}
    </div>

    {{ with .Params.tags }}
      <footer class="post-footer">
        <div class="post-tags">
          {{ range . }}<a class="tag" href="{{ "tags/" | relLangURL }}{{ . | urlize }}">#{{ . }}</a>{{ end }}
        </div>
      </footer>
    {{ end }}
  </article>
</div>
{{ end }}
